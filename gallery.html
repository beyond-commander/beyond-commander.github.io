<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery — Beyond Commander</title>
  <meta name="description" content="Beyond Commander screenshots for Linux, Android, Windows and macOS, arranged by platform.">
  <link rel="canonical" href="https://beyond-commander.github.io/gallery.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Beyond Commander">
  <meta property="og:title" content="Beyond Commander Gallery">
  <meta property="og:description" content="Beyond Commander screenshots arranged by platform.">
  <meta property="og:url" content="https://beyond-commander.github.io/gallery.html">
  <meta property="og:image" content="https://beyond-commander.github.io/assets/beyond-commander-social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Beyond Commander Gallery">
  <meta name="twitter:description" content="Beyond Commander screenshots arranged by platform.">
  <meta name="twitter:image" content="https://beyond-commander.github.io/assets/beyond-commander-social.png">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/bc2.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div id="nav"></div>
  <main>
    <section class="page-hero gallery-hero">
      <div class="wrap">
        <span class="eyebrow" data-i18n="gallery"></span>
        <h1 data-i18n="galleryTitle"></h1>
        <p class="copy" data-i18n="galleryLead"></p>
      </div>
    </section>

    <section class="section gallery-section">
      <div class="wrap gallery-categories">
        <section class="gallery-category" aria-labelledby="gallery-linux-title">
          <div class="gallery-category-head">
            <h2 id="gallery-linux-title" data-i18n="galleryLinux"></h2>
            <span class="gallery-count">3</span>
          </div>
          <div class="gallery-grid">
            <button class="gallery-item" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Linux_Desktop_1.jpg" data-gallery-caption="Linux — Desktop 1" aria-label="Linux — Desktop 1">
              <img src="assets/screenshots/Beyond-Commander_Linux_Desktop_1.jpg" alt="Beyond Commander on Linux — Desktop screenshot 1" loading="lazy">
              <span>Linux — Desktop 1</span>
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Linux_Desktop_2.jpg" data-gallery-caption="Linux — Desktop 2" aria-label="Linux — Desktop 2">
              <img src="assets/screenshots/Beyond-Commander_Linux_Desktop_2.jpg" alt="Beyond Commander on Linux — Desktop screenshot 2" loading="lazy">
              <span>Linux — Desktop 2</span>
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Linux_Desktop_3.jpg" data-gallery-caption="Linux — Desktop 3" aria-label="Linux — Desktop 3">
              <img src="assets/screenshots/Beyond-Commander_Linux_Desktop_3.jpg" alt="Beyond Commander on Linux — Desktop screenshot 3" loading="lazy">
              <span>Linux — Desktop 3</span>
            </button>
          </div>
        </section>

        <section class="gallery-category" aria-labelledby="gallery-android-title">
          <div class="gallery-category-head">
            <h2 id="gallery-android-title" data-i18n="galleryAndroid"></h2>
            <span class="gallery-count">6</span>
          </div>
          <div class="gallery-grid">
            <button class="gallery-item portrait" type="button" data-gallery-src="assets/screenshots/Beyond-Commadner_Android_Alpha2.jpg" data-gallery-caption="Android — Alpha 2" aria-label="Android — Alpha 2">
              <img src="assets/screenshots/Beyond-Commadner_Android_Alpha2.jpg" alt="Beyond Commander Android Alpha 2" loading="lazy">
              <span>Android — Alpha 2</span>
            </button>
            <button class="gallery-item portrait" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Android_Tablet_1.png" data-gallery-caption="Android — Tablet 1" aria-label="Android — Tablet 1">
              <img src="assets/screenshots/Beyond-Commander_Android_Tablet_1.png" alt="Beyond Commander on Android tablet — screenshot 1" loading="lazy">
              <span>Android — Tablet 1</span>
            </button>
            <button class="gallery-item portrait" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Android_Tablet_2.png" data-gallery-caption="Android — Tablet 2" aria-label="Android — Tablet 2">
              <img src="assets/screenshots/Beyond-Commander_Android_Tablet_2.png" alt="Beyond Commander on Android tablet — screenshot 2" loading="lazy">
              <span>Android — Tablet 2</span>
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Android_Tablet_3.png" data-gallery-caption="Android — Tablet 3" aria-label="Android — Tablet 3">
              <img src="assets/screenshots/Beyond-Commander_Android_Tablet_3.png" alt="Beyond Commander on Android tablet — screenshot 3" loading="lazy">
              <span>Android — Tablet 3</span>
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Android_mobile_1.png" data-gallery-caption="Android — Mobile 1" aria-label="Android — Mobile 1">
              <img src="assets/screenshots/Beyond-Commander_Android_mobile_1.png" alt="Beyond Commander on Android mobile — screenshot 1" loading="lazy">
              <span>Android — Mobile 1</span>
            </button>
            <button class="gallery-item portrait" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Android_mobile_2.png" data-gallery-caption="Android — Mobile 2" aria-label="Android — Mobile 2">
              <img src="assets/screenshots/Beyond-Commander_Android_mobile_2.png" alt="Beyond Commander on Android mobile — screenshot 2" loading="lazy">
              <span>Android — Mobile 2</span>
            </button>
          </div>
        </section>

        <section class="gallery-category" aria-labelledby="gallery-windows-title">
          <div class="gallery-category-head">
            <h2 id="gallery-windows-title" data-i18n="galleryWindows"></h2>
            <span class="gallery-count">2</span>
          </div>
          <div class="gallery-grid">
            <button class="gallery-item" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Win10_1.jpg" data-gallery-caption="Windows 10 — Dark" aria-label="Windows 10 — Dark">
              <img src="assets/screenshots/Beyond-Commander_Win10_1.jpg" alt="Beyond Commander on Windows 10 — dark theme" loading="lazy">
              <span>Windows 10 — Dark</span>
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/screenshots/Beyond-Commander_Win10_2.jpg" data-gallery-caption="Windows 10 — Light" aria-label="Windows 10 — Light">
              <img src="assets/screenshots/Beyond-Commander_Win10_2.jpg" alt="Beyond Commander on Windows 10 — light theme" loading="lazy">
              <span>Windows 10 — Light</span>
            </button>
          </div>
        </section>

        <section class="gallery-category" aria-labelledby="gallery-macos-title">
          <div class="gallery-category-head">
            <h2 id="gallery-macos-title" data-i18n="galleryMac"></h2>
            <span class="gallery-count">0</span>
          </div>
          <div class="gallery-empty">
            <img src="assets/bc2.svg" alt="" aria-hidden="true">
            <p data-i18n="galleryNoMac"></p>
          </div>
        </section>

        <p class="gallery-source" data-i18n="gallerySource"></p>
      </div>
    </section>
  </main>
  <div id="foot"></div>

  <div class="gallery-modal" data-gallery-modal hidden role="dialog" aria-modal="true" aria-label="Screenshot preview">
    <div class="gallery-modal-backdrop" data-gallery-close></div>
    <div class="gallery-modal-panel">
      <button class="gallery-modal-close" type="button" data-gallery-close aria-label="Close" title="Close">
        <span aria-hidden="true">×</span><span class="gallery-close-label" data-i18n="galleryClose"></span>
      </button>
      <img class="gallery-modal-image" data-gallery-modal-image src="" alt="">
      <div class="gallery-modal-caption" data-gallery-modal-caption></div>
    </div>
  </div>

  <script src="assets/site.js"></script>
  <script>
    document.getElementById('nav').innerHTML=nav('gallery');
    document.getElementById('foot').innerHTML=footer();
    (()=>{
      const modal=document.querySelector('[data-gallery-modal]');
      const modalImage=document.querySelector('[data-gallery-modal-image]');
      const modalCaption=document.querySelector('[data-gallery-modal-caption]');
      const closeButton=document.querySelector('.gallery-modal-close');
      let lastTrigger=null;
      function openGallery(item){
        lastTrigger=item;
        modalImage.src=item.dataset.gallerySrc;
        modalImage.alt=item.querySelector('img')?.alt||item.dataset.galleryCaption||'';
        modalCaption.textContent=item.dataset.galleryCaption||'';
        modal.hidden=false;
        document.body.classList.add('gallery-modal-open');
        closeButton.focus();
      }
      function closeGallery(){
        if(modal.hidden)return;
        modal.hidden=true;
        modalImage.src='';
        document.body.classList.remove('gallery-modal-open');
        lastTrigger?.focus();
      }
      document.querySelectorAll('[data-gallery-src]').forEach(item=>item.addEventListener('click',()=>openGallery(item)));
      document.querySelectorAll('[data-gallery-close]').forEach(el=>el.addEventListener('click',closeGallery));
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden)closeGallery()});
    })();
  </script>
</body>
</html>
