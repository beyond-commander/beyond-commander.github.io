<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support & Contact — Beyond Commander</title>
  <meta name="description" content="Beyond Commander support and contact information.">
  <link rel="canonical" href="https://beyond-commander.github.io/support.html">
  <link rel="icon" href="assets/bc2.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div id="nav"></div>
  <main>
    <section class="page-hero contact-hero">
      <div class="wrap contact-hero-grid">
        <div class="contact-copy">
          <h1 data-i18n="contactTitle"></h1>
          <p class="copy" data-i18n="contactLead"></p>
          <div class="contact-details">
            <div class="contact-line"><span data-i18n="contactProject"></span><strong>Beyond Commander (beyondcmd)</strong></div>
            <div class="contact-line"><span data-i18n="contactEmail"></span><a class="plugin-link protected-email" data-contact-email-link href="#">JavaScript required</a></div>
          </div>
        </div>
        <div class="contact-logo-panel">
          <img src="assets/bc2.svg" alt="Beyond Commander">
        </div>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <h2 class="section-title" data-i18n="supportTitle"></h2>
        <p class="section-lead" data-i18n="supportLead"></p>
        <div class="support-grid">
          <div class="card"><h3 data-i18n="s1"></h3><p data-i18n="s1d"></p><p style="margin-top:16px"><a class="plugin-link" data-support-email data-i18n="emailSupport"></a></p></div>
          <div class="card"><h3 data-i18n="s2"></h3><p data-i18n="s2d"></p></div>
          <div class="card"><h3 data-i18n="s3"></h3><p data-i18n="s3d"></p></div>
          <div class="card"><h3 data-i18n="s4"></h3><p data-i18n="s4d"></p></div>
        </div>
        <div class="cta-strip"><div><strong data-i18n="betaJoin"></strong><div data-i18n="betaJoinD"></div></div><a class="btn primary" data-beta target="_blank" rel="noopener" data-i18n="beta"></a></div>
        <div class="platforms" style="margin-top:30px"><span class="platform future">Windows <span class="badge-coming" data-i18n="coming"></span></span><span class="platform future">macOS <span class="badge-coming" data-i18n="coming"></span></span><span class="platform active"><span class="platform-active-badge">🐧 Linux</span></span><span class="platform future">Android <span class="badge-coming" data-i18n="coming"></span></span></div>
      </div>
    </section>
  </main>
  <div id="foot"></div>
  <script src="assets/site.js"></script>
  <script>document.getElementById('nav').innerHTML=nav('support');document.getElementById('foot').innerHTML=footer();</script>
</body>
</html>
